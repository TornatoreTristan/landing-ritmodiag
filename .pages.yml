media:
  - name: img
    label: Images générales
    input: src/assets/img
    output: ""
    extensions: [jpg, jpeg, png, webp, svg]
  - name: equipe
    label: Photos équipe
    input: src/assets/img/equipe
    output: ""
    extensions: [jpg, jpeg, png, webp]

content:
  - name: franchises
    label: Franchises (liste unique)
    type: file
    path: src/data/franchises.json
    format: json
    list: true
    view:
      fields: [nom]
      primary: nom
      default:
        sort: nom
        order: asc
    fields:
      - name: nom
        label: Nom de la ville
        type: string
        required: true
  - name: villes
    label: Villes (landings)
    type: collection
    path: src/data/villes
    format: json
    filename: "{fields.slug}.json"
    view:
      fields: [city_name, slug, departements, telephone]
      primary: city_name
      search: [city_name, slug, departements]
      sort: [city_name, slug]
      default:
        sort: city_name
        order: asc
    fields:
      - name: slug
        label: Slug (URL)
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "Lettres minuscules, chiffres et tirets uniquement"
      - name: city_name
        label: Nom de la ville
        type: string
        required: true
      - name: header_image
        label: Image d'en-tête
        type: image
        options:
          media: img
      - name: id_crm
        label: ID CRM
        type: string
      - name: iframe_simulateur
        label: URL iframe simulateur
        type: string
      - name: telephone
        label: Téléphone
        type: string
      - name: email_contact
        label: Email de contact
        type: string
      - name: departements
        label: Départements couverts
        type: string
      - name: footer_zones
        label: Zones du pied de page (vide = tout le réseau)
        type: string
        list: true
      - name: mode
        label: Mode d'affichage équipe
        type: select
        options:
          values:
            - { value: solo, label: "Solo (1 diagnostiqueur)" }
            - { value: team, label: "Équipe" }
          default: team
      - name: masquer_franchises
        label: Masquer la liste des autres agences
        type: boolean
      - name: hero
        label: Bandeau Google Ads (H1 court, prix, formulaire)
        description: "Laisser vide pour garder le bandeau classique. Le texte avant la première virgule du titre passe en vert."
        type: object
        fields:
          - { name: h1, label: Titre par défaut, type: string }
          - { name: h1_prix, label: "Titre si ?angle=prix", type: string }
          - { name: h1_vente, label: "Titre si ?angle=vente", type: string }
          - { name: h1_location, label: "Titre si ?angle=location", type: string }
          - { name: prix_dpe, label: Prix d'appel DPE (€), type: number }
      - name: seo_titre
        label: Titre SEO
        type: string
      - name: seo_desc
        label: Meta description SEO
        type: text
      - name: agence
        label: Agence
        type: object
        fields:
          - { name: ville, label: Ville, type: string }
          - { name: adresse, label: Adresse, type: string }
          - { name: code_postal, label: Code postal, type: string }
          - { name: rayon_km, label: Rayon d'intervention (km), type: number }
          - { name: villes_desservies, label: Villes desservies, type: string, list: true }
          - { name: description, label: Description, type: text }
      - name: sales_team
        label: Équipe commerciale
        type: object
        list: true
        fields:
          - { name: nom, label: Nom, type: string }
          - { name: role, label: Rôle, type: string }
          - name: photo
            label: Photo
            type: image
            options:
              media: equipe
          - { name: email, label: Email, type: string }
          - { name: telephone, label: Téléphone, type: string }
      - name: technical_team
        label: Équipe technique
        type: object
        list: true
        fields:
          - { name: nom, label: Nom, type: string }
          - { name: role, label: Rôle, type: string }
          - name: photo
            label: Photo
            type: image
            options:
              media: equipe
      - name: avis
        label: Avis clients
        type: object
        list: true
        fields:
          - { name: auteur, label: Auteur, type: string }
          - name: note
            label: Note
            type: number
            options: { min: 1, max: 5, step: 1 }
          - { name: texte, label: Texte de l'avis, type: text }
          - { name: photo, label: URL photo (pravatar/avatar), type: string }
